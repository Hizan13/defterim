<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#463b2e"><link rel="manifest" href="manifest.webmanifest">
<title>Defterim</title>
<style>
:root{--ink:#30291f;--muted:#82796d;--wood:#574735;--paper:#fffaf0;--green:#687c4a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#f4efe6,#d9d0c3 75%);font-family:Georgia,"Times New Roman",serif;color:var(--ink);min-height:100vh}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#f8f4eddd;border-bottom:1px solid #c9beae;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
header strong{font-size:19px;letter-spacing:.4px}button{font:inherit;border:0;cursor:pointer} .btn{background:#63513c;color:#fff;border-radius:22px;padding:10px 15px;box-shadow:0 3px 8px #382b1e35}.btn.light{background:#e8dfd1;color:#4b4033;box-shadow:none}
main{max-width:850px;margin:auto;padding:20px 14px 100px}.screen{display:none}.screen.active{display:block}
h2{font-size:20px;font-weight:normal;margin:8px 0 18px}.hint{font:13px -apple-system,sans-serif;color:#7b7063}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.book-card{height:245px;border-radius:8px 15px 15px 8px;padding:17px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:5px 9px 17px #47372545,inset 7px 0 8px #0003;cursor:pointer;border-left:7px solid #0003}
.book-card:after,.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,#ffffff24,transparent 25%,#00000013 100%);pointer-events:none}
.book-card b{font-size:22px;line-height:1.2;text-shadow:0 2px 4px #0005}.book-card small{font:12px -apple-system,sans-serif;opacity:.85}
.green{background:linear-gradient(120deg,#23472b,#6f9365)}.blue{background:linear-gradient(120deg,#075a78,#47b4c7)}.pink{background:linear-gradient(120deg,#c87991,#f4c6cf);color:#57313c}.brown{background:linear-gradient(120deg,#60462e,#b38a5b)}
.add-card{height:245px;border:2px dashed #a99b87;border-radius:12px;background:#f2ece2;color:#716554;font:16px -apple-system,sans-serif;display:grid;place-items:center}
.formbox{background:#f7f1e7;border:1px solid #d4c8b7;border-radius:14px;padding:16px;box-shadow:0 4px 12px #59452a12}
label{display:block;font:600 13px -apple-system,sans-serif;margin:13px 0 6px}input,select{width:100%;border:1px solid #cfc2af;border-radius:9px;background:#fffdf8;padding:12px;font:16px -apple-system,sans-serif;color:#30291f}
.theme-row{display:flex;gap:12px;margin:12px 0}.swatch{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px #0003}.swatch.selected{outline:2px solid #6b7e4c}
.cover-preview{height:170px;margin:14px 0;border-radius:5px 13px 13px 5px;border-left:9px solid #0003;display:grid;place-items:center;color:white;font-size:25px;text-align:center;padding:20px;box-shadow:5px 8px 15px #0003;position:relative;overflow:hidden}
.reader-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}.reader-head strong{font-size:17px;font-weight:normal}.reader-head .grow{flex:1}
.bookstage{perspective:1600px;padding:4px 2px 16px}
.openbook{display:flex;position:relative;min-height:61vh;filter:drop-shadow(0 12px 12px #4b392b35);transform-style:preserve-3d}
.openbook:before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:18px;transform:translateX(-50%);background:linear-gradient(90deg,#d7cbb6,#9d8b73 45%,#eee4d3 55%,#c4b59e);z-index:2;border-radius:50%;box-shadow:0 0 8px #5c4b3733}
.page{width:50%;position:relative;background-color:var(--paper);padding:25px 19px 38px;min-height:61vh;box-shadow:inset 0 0 18px #a68f6b1c;overflow:hidden}
.page.left{border-radius:5px 0 0 5px;background-image:linear-gradient(90deg,#e7dcc8 0,#fffaf0 8%,#fffaf0 100%)}
.page.right{border-radius:0 5px 5px 0;background-image:linear-gradient(90deg,#fffaf0 0,#fffaf0 92%,#e7dcc8 100%)}
.page.left:after,.page.right:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:#d7cbb9;opacity:.45}
.page.left:after{left:16px}.page.right:after{right:16px}
.page-number{position:absolute;bottom:13px;left:0;right:0;text-align:center;color:#9b8e7b;font:12px Georgia}
.page textarea{width:100%;height:calc(61vh - 65px);min-height:260px;resize:none;border:0;outline:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#dce1e4 30px);font:16px/30px Georgia,serif;color:#3d352c;padding:0 2px}
.page.blank textarea{background:none}.page.grid textarea{background-image:linear-gradient(#dce1e4 1px,transparent 1px),linear-gradient(90deg,#dce1e4 1px,transparent 1px);background-size:22px 30px}
.page.left textarea{direction:ltr}
.turn{animation:turn .48s ease both;transform-origin:left center}@keyframes turn{0%{transform:rotateY(0);z-index:4}50%{transform:rotateY(-82deg);z-index:4}100%{transform:rotateY(0);z-index:1}}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font:13px -apple-system,sans-serif;color:#716657}
.cover-view{max-width:430px;margin:20px auto;text-align:center}.cover{height:65vh;max-height:590px;min-height:440px;border-radius:8px 18px 18px 8px;border-left:15px solid #0004;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;color:white;box-shadow:12px 16px 25px #34271e55,inset 5px 0 10px #ffffff20;overflow:hidden}
.cover .ornament{border:1px solid #ffffff88;padding:25px 15px;width:80%;min-height:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.cover h1{font-size:32px;font-weight:normal;margin:0;text-shadow:0 2px 5px #0004}.cover .rule{width:55%;height:1px;background:#ffffff99}
.cover small{font:12px -apple-system,sans-serif;letter-spacing:2px;text-transform:uppercase}
.empty{text-align:center;color:#82796d;padding:20px;font:14px -apple-system,sans-serif}
nav{position:fixed;bottom:0;left:0;right:0;background:#f8f4edee;border-top:1px solid #c9beae;display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:12;backdrop-filter:blur(12px)}
nav button{background:none;color:#6d6254;padding:7px 14px;font:12px -apple-system,sans-serif}nav button.active{color:#42582e;background:#e6e8dc;border-radius:12px}
@media(max-width:480px){main{padding:15px 12px 100px}.book-card,.add-card{height:210px}.openbook{min-height:57vh}.page{min-height:57vh;padding:22px 13px 35px}.page textarea{height:calc(57vh - 60px);font-size:15px}.openbook:before{width:13px}.page.left:after{left:10px}.page.right:after{right:10px}}
@media(max-width:360px){.page{padding:18px 10px 32px}.page textarea{font-size:14px}}
</style></head>
<body>
<header><button class="btn light" id="back" onclick="goShelf()" style="visibility:hidden">‹ Geri</button><strong>Defterim</strong><button class="btn" onclick="newBook()">+ Yeni</button></header>
<main>
<section id="shelf" class="screen active"><h2>Kitaplığım</h2><p class="hint">Defterlerini seç, kapağını aç ve yazmaya başla.</p><div id="books" class="shelf"></div></section>
<section id="create" class="screen"><h2>Yeni defter</h2><div class="formbox"><label>Defter adı</label><input id="name" placeholder="Örn. Günlük Notlarım" maxlength="40"><label>Kapak rengi</label><div class="theme-row">
<button class="swatch selected green" onclick="pick('green',this)"></button><button class="swatch blue" onclick="pick('blue',this)"></button><button class="swatch pink" onclick="pick('pink',this)"></button><button class="swatch brown" onclick="pick('brown',this)"></button></div><div id="preview" class="cover-preview green">Yeni Defter</div><label>İç sayfa düzeni</label><select id="type"><option value="lined">Çizgili</option><option value="blank">Boş</option><option value="grid">Kareli</option></select><button class="btn" style="width:100%;margin-top:18px" onclick="createBook()">Defteri oluştur</button></div></section>
<section id="coverScreen" class="screen"><div class="cover-view"><div id="bigCover" class="cover green"><div class="ornament"><small>KİŞİSEL DEFTER</small><div class="rule"></div><h1 id="coverTitle">Defterim</h1><div class="rule"></div><small>NOTLAR • DÜŞÜNCELER • HATIRALAR</small></div></div><button class="btn" style="margin-top:22px;padding:14px 28px" onclick="openInside()">Kapağı aç&nbsp; →</button><p class="hint">Kapağa dokunarak defterinin içine geç.</p></div></section>
<section id="reader" class="screen"><div class="reader-head"><button class="btn light" onclick="showCover()">Kapak</button><strong id="readerName"></strong><span class="grow"></span><button class="btn" onclick="addPage()">+ Sayfa</button></div>
<div class="bookstage"><div class="openbook" id="openbook">
<div class="page left" id="leftPage"><textarea id="leftText" placeholder="Buraya yazmaya başlayabilirsin..."></textarea><div class="page-number" id="leftNum"></div></div>
<div class="page right" id="rightPage"><textarea id="rightText" placeholder="Buraya yazmaya başlayabilirsin..."></textarea><div class="page-number" id="rightNum"></div></div>
</div></div><div class="controls"><button class="btn light" onclick="turn(-1)">‹ Önceki</button><span id="count">1–2 / 2</span><button class="btn light" onclick="turn(1)">Sonraki ›</button></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn light" onclick="renameBook()">Defter adını değiştir</button><button class="btn light" onclick="removeBook()">Defteri sil</button></div></section>
</main>
<nav><button id="navShelf" class="active" onclick="goShelf()">▤<br>Kitaplık</button><button id="navNew" onclick="newBook()">＋<br>Yeni defter</button></nav>
<script>
const themes={green:'linear-gradient(120deg,#23472b,#6f9365)',blue:'linear-gradient(120deg,#075a78,#47b4c7)',pink:'linear-gradient(120deg,#c87991,#f4c6cf)',brown:'linear-gradient(120deg,#60462e,#b38a5b)'};
let books=JSON.parse(localStorage.getItem('defterim_real_books')||'[]'),theme='green',current=null,spread=0;
function persist(){localStorage.setItem('defterim_real_books',JSON.stringify(books))}
function screen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('back').style.visibility=id==='shelf'?'hidden':'visible';document.getElementById('navShelf').classList.toggle('active',id==='shelf');document.getElementById('navNew').classList.toggle('active',id==='create')}
function goShelf(){persist();drawShelf();screen('shelf')}
function newBook(){screen('create');document.getElementById('name').value='';}
function pick(t,el){theme=t;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');document.getElementById('preview').className='cover-preview '+t}
document.getElementById('name').addEventListener('input',e=>document.getElementById('preview').textContent=e.target.value||'Yeni Defter');
function createBook(){let title=document.getElementById('name').value.trim()||'Adsız Defter';current={id:Date.now(),title,theme,type:document.getElementById('type').value,pages:['','']};books.push(current);persist();showCover()}
function drawShelf(){let el=document.getElementById('books');el.innerHTML='';books.forEach(b=>{let card=document.createElement('div');card.className='book-card '+b.theme;let t=document.createElement('b');t.textContent=b.title;let sm=document.createElement('small');sm.textContent='Kapağı aç  ·  '+b.pages.length+' sayfa';card.append(t,sm);card.onclick=()=>{current=b;showCover()};el.append(card)});let add=document.createElement('button');add.className='add-card';add.innerHTML='<span style="font-size:34px">＋</span><span>Yeni defter oluştur</span>';add.onclick=newBook;el.append(add);if(!books.length){let e=document.createElement('div');e.className='empty';e.textContent='Henüz defterin yok. İlk defterini oluştur.';el.prepend(e)}}
function showCover(){if(!current)return;document.getElementById('bigCover').className='cover '+current.theme;document.getElementById('coverTitle').textContent=current.title;screen('coverScreen')}
function openInside(){spread=0;document.getElementById('readerName').textContent=current.title;screen('reader');renderSpread()}
function showCoverFromReader(){showCover()}
function showCover(){if(!current)return;document.getElementById('bigCover').className='cover '+current.theme;document.getElementById('coverTitle').textContent=current.title;screen('coverScreen')}
function renderSpread(){let l=spread*2,r=l+1;let left=document.getElementById('leftText'),right=document.getElementById('rightText');left.value=current.pages[l]??'';right.value=current.pages[r]??'';left.readOnly=false;right.readOnly=false;document.getElementById('leftNum').textContent=l+1;document.getElementById('rightNum').textContent=r+1;document.getElementById('count').textContent=(l+1)+'–'+Math.min(r+1,current.pages.length)+' / '+current.pages.length;['leftPage','rightPage'].forEach(id=>{let p=document.getElementById(id);p.className='page '+(id==='leftPage'?'left ':'right ')+current.type});document.getElementById('readerName').textContent=current.title}
document.getElementById('leftText').addEventListener('input',e=>{if(current){let idx=spread*2;while(current.pages.length<=idx)current.pages.push('');current.pages[idx]=e.target.value;persist()}});
document.getElementById('rightText').addEventListener('input',e=>{if(current){let idx=spread*2+1;while(current.pages.length<=idx)current.pages.push('');current.pages[idx]=e.target.value;persist()}});
function turn(dir){let next=spread+dir;if(next<0)return;if(next*2>=current.pages.length&&dir>0){current.pages.push('','');persist()}let el=document.getElementById('rightPage');el.classList.add('turn');setTimeout(()=>{spread=next;renderSpread();el.classList.remove('turn')},230)}
function addPage(){current.pages.push('','');spread=Math.floor((current.pages.length-2)/2);persist();renderSpread();document.getElementById('rightText').focus()}
function renameBook(){let n=prompt('Yeni defter adı:',current.title);if(n&&n.trim()){current.title=n.trim();persist();document.getElementById('readerName').textContent=current.title;document.getElementById('coverTitle').textContent=current.title}}
function removeBook(){if(confirm('Bu defteri ve içindeki sayfaları silmek istiyor musun?')){books=books.filter(b=>b.id!==current.id);current=null;goShelf()}}
function showCover(){if(!current)return;document.getElementById('bigCover').className='cover '+current.theme;document.getElementById('coverTitle').textContent=current.title;screen('coverScreen')}
function showCover(){if(!current)return;document.getElementById('bigCover').className='cover '+current.theme;document.getElementById('coverTitle').textContent=current.title;screen('coverScreen')}
function showCover(){if(!current)return;document.getElementById('bigCover').className='cover '+current.theme;document.getElementById('coverTitle').textContent=current.title;screen('coverScreen')}
function showCover(){if(!current)return;document.getElementById('bigCover').className='cover '+current.theme;document.getElementById('coverTitle').textContent=current.title;screen('coverScreen')}
drawShelf();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
